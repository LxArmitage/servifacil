{% extends "base.html" %}
{% block title %}Iniciar sesión — ServiFácil{% endblock %}

{% block ancho %}contenedor-chico{% endblock %}

{% block contenido %}
<h1>Iniciar sesión</h1>
<p class="subtitulo">Entra con tu correo y contraseña</p>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label for="correo" class="form-label">Correo electrónico</label>
        <input type="email" id="correo" name="correo" class="form-control"
               value="{{ datos.correo or '' }}" required>
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" id="password" name="password"
               class="form-control" required>
    </div>
    <div class="botones">
        <button type="submit" class="btn btn-primary">Ingresar</button>
    </div>
</form>

<p class="text-center mt-3 mb-0">
    ¿No tienes cuenta?
    <a href="{{ url_for('auth.registro') }}">Regístrate aquí</a>
</p>
{% endblock %}
