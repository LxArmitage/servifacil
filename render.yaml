# Blueprint de Render: crea la base de datos PostgreSQL y la aplicación web
# y las conecta entre sí. En Render: New > Blueprint > elegir este repositorio.

databases:
  - name: servifacil-db
    plan: free
    databaseName: servifacil
    user: servifacil

services:
  - type: web
    name: servifacil
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      # Conexión a la base de datos de arriba (Render la llena solo)
      - key: DATABASE_URL
        fromDatabase:
          name: servifacil-db
          property: connectionString
      # Clave para firmar las sesiones (Render genera una al azar)
      - key: SECRET_KEY
        generateValue: true
      # Contraseña del administrador: Render la pide al crear el Blueprint
      - key: ADMIN_PASSWORD
        sync: false
